server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite 产物文件名带 hash，可以放心长缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 发布数据：图片名不带 hash、catalog 会被发布覆盖，一律不进缓存
  # （前台的 loadCatalog 自己也带 cache: 'no-cache'，但那只管浏览器、管不到中间层）
  location /spots/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # HashRouter 的路径都在 # 后面，正常不会打到别的路径；
  # 这条兜底只是防「刷新带路径的地址」白屏
  location / {
    try_files $uri $uri/ /index.html;
  }
}
