server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 可选的旧 Nginx 前置部署：Node 必须在 upstream backend:3001 运行。
  # 默认 docker-compose 已直接运行 Node，不使用此文件。
  location /__trip_guide/ {
    client_max_body_size 16m;
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Vite 产物文件名带 hash，可以放心长缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 发布数据：图片名不带 hash、catalog 会被发布覆盖，一律不进缓存
  # （前台的 loadCatalog 自己也带 cache: 'no-cache'，但那只管浏览器、管不到中间层）
  location /spots/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
  }

  # HashRouter 的路径都在 # 后面，正常不会打到别的路径；
  # 这条兜底只是防「刷新带路径的地址」白屏
  location / {
    try_files $uri $uri/ /index.html;
  }
}
