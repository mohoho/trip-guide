services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: trip-guide-web:latest
    container_name: trip-guide-web
    restart: unless-stopped
    environment:
      PUBLISH_ADMIN_TOKEN: ${PUBLISH_ADMIN_TOKEN:?请在 .env 中设置至少24位的发布口令}
    ports:
      # 宿主 80/443 被 1Panel 的 OpenResty 占着，这里走 8080。
      # Node 同时提供页面、发布接口和动态景点数据。
      - "8080:3001"
    volumes:
      - publish-data:/app/data
    stop_grace_period: 30s

volumes:
  publish-data:
